server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router: cualquier ruta desconocida vuelve a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Archivos generados por Vite con hash: caché larga
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
