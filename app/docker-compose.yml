# Levanta todo UPB Conecta: base de datos, backend y frontend.
#   cp .env.example .env
#   docker compose up --build
# Frontend: http://localhost:3000  ·  API: http://localhost:8080/api/v1/health

services:
  db:
    image: postgres:16-alpine
    container_name: upbconecta-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./app/backend
    container_name: upbconecta-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./app/frontend
      args:
        # El navegador del usuario llama al backend, por eso es localhost y no "backend"
        VITE_API_URL: ${VITE_API_URL}
    container_name: upbconecta-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  db_data:
