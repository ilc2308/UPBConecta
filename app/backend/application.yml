spring:
  application:
    name: upbconecta-backend

  # Conexión a PostgreSQL 16: todo sale de variables de entorno (ver .env.example)
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:upbconecta}
    username: ${DB_USER:upbconecta}
    password: ${DB_PASSWORD:upbconecta}

  jpa:
    hibernate:
      # update crea/ajusta las tablas en desarrollo; cambiar a validate cuando haya migraciones
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    # Orígenes permitidos, separados por comas
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
